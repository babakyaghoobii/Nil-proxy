name: Build Nil-proxy native apps

on:
  push:
    branches: [nil-native, nil/ios-usb]
  workflow_dispatch:

permissions:
  contents: read

env:
  CHANNEL: prod

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(github.ref_name == 'nil/ios-usb' && '["ios"]' || '["android","macos","ios"]') }}
    runs-on: ${{ matrix.platform == 'android' && 'ubuntu-latest' || 'macos-26' }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - uses: actions/setup-java@v5
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android'
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358
      - name: Prepare app and pinned native core
        shell: bash
        run: |
          set -eo pipefail
          make common-prepare
          make "${{ matrix.platform }}-libs" SHELL=bash '.SHELLFLAGS=-o pipefail -c'
      - name: Analyze and test
        if: matrix.platform == 'android'
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Build Android APK with development signature
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --target lib/main_prod.dart
          mkdir -p native-output
          cp build/app/outputs/flutter-apk/app-release.apk native-output/Nil-proxy-Android-preview.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify native-output/Nil-proxy-Android-preview.apk
      - name: Build macOS application and disk image
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          export XCODE_XCCONFIG_FILE="$PWD/macos/Runner/Configs/Unsigned.xcconfig"
          flutter build macos --release --target lib/main_prod.dart
          mkdir -p native-output
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          ditto build/macos/Build/Products/Release/Hiddify.app "$staging/Nil-proxy.app"
          codesign --verify --deep --strict "$staging/Nil-proxy.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname Nil-proxy -srcfolder "$staging" -format UDZO native-output/Nil-proxy-macOS-preview.dmg
          hdiutil verify native-output/Nil-proxy-macOS-preview.dmg
      - name: Build iOS and smoke test simulator launch
        if: matrix.platform == 'ios' && github.ref_name != 'nil/ios-usb'
        run: |
          make ios-validate
          bash .github/scripts/smoke_test_ios_simulator.sh
      - name: Verify unsigned iPhone device build
        if: matrix.platform == 'ios' && github.ref_name == 'nil/ios-usb'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          flutter build ios --debug --no-codesign --target lib/main.dart
          app="build/ios/iphoneos/Runner.app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist" |
            grep -Fx io.github.babakyaghoobii.nilproxy
          extension="$app/PlugIns/HiddifyPacketTunnel.appex"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$extension/Info.plist" |
            grep -Fx io.github.babakyaghoobii.nilproxy.HiddifyPacketTunnel
      - uses: actions/upload-artifact@v6
        if: matrix.platform != 'ios'
        with:
          name: Nil-proxy-${{ matrix.platform }}-preview
          path: native-output/
          if-no-files-found: error
